<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='dist/output.css') }}"
    />
    <title>Greenwall</title>
  </head>
  <body class="text-primary">
    <!-- Loading Screen -->
    <div
      id="loading-screen"
      class="flex min-h-dvh items-center justify-center bg-surface p-8"
    >
      <span
        class="icon-[svg-spinners--pulse-rings-multiple] text-9xl text-accent"
      ></span>
    </div>
    <!--Auth Screen -->
    <div
      id="auth-screen"
      class="flex min-h-dvh items-center justify-center bg-surface p-8"
    >
      <div
        id="auth-card"
        class="grid w-full max-w-175 grid-cols-[1fr_1fr] overflow-hidden rounded-2xl border-2 border-solid border-primary"
      >
        <div class="flex w-full flex-col overflow-hidden bg-white p-8">
          <p class="mb-2 font-heading text-6xl wrap-break-word">greenwall</p>
          <p id="auth-welcome-text" class="text-2xl">welcome!</p>
        </div>
        <div
          class="flex w-full flex-col justify-center overflow-hidden bg-accent p-8"
        >
          <p id="auth-right-title" class="mb-4 text-4xl text-white">
            Sign up to Greenwall
          </p>
          <div class="mt-3">
            <p>Private username</p>
            <input
              class="w-full rounded-lg border-2 border-solid border-primary bg-white px-4 py-2 text-primary placeholder-gray-500 focus:outline-none"
              type="text"
              id="auth-username-input"
              data-action="enterSignupUsername"
              placeholder="Private username"
              maxlength="20"
            />
          </div>
          <div class="mt-3">
            <p>Password</p>
            <input
              class="w-full rounded-lg border-2 border-solid border-primary bg-white px-4 py-2 text-primary placeholder-gray-500 focus:outline-none"
              type="text"
              id="auth-password-input"
              data-action="enterSignupPassword"
              placeholder="Password"
              maxlength="20"
            />
          </div>
          <p id="error-message" class="mb-4 min-h-5 text-danger"></p>
          <div class="flex flex-col items-center justify-center gap-4">
            <button
              id="auth-button"
              class="cursor-pointer rounded-4xl border-none bg-primary px-16 py-2 text-white transition-all duration-300 hover:scale-110 active:scale-100"
              data-action="signup"
            >
              Sign up
            </button>
            <div class="flex flex-row gap-1">
              <span id="auth-goto-text" class="text-primary"
                >Already have an account? 
              </span>
              <span
                  id="auth-goto-link"
                  class="cursor-pointer select-none underline transition-all duration-300 hover:text-white"
                  data-action="goToLogin"
                  >Log in
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Screen -->
    <main
      id="main-screen"
      class="grid h-dvh grid-cols-[20%_1fr_20%] grid-rows-[3rem_1fr] overflow-hidden bg-surface"
    >
      <!-- HEADER -->
      <section
        class="sticky top-0 col-span-full h-12 border-b-2 border-solid border-b-primary bg-accent"
      >
        <h1 class="ml-6 font-heading text-white">greenwall</h1>
      </section>
      <!-- LEFT SIDE BAR / NAVIGATION -->
      <section
        class="h-[calc(100dvh - 3rem)] sticky top-12 overflow-x-hidden overflow-y-auto"
      >
        <nav id="page-navigator" class="mt-8 flex flex-col select-none">
          <a href="#" data-pagename="user-profile" data-action="navigate">
            <span class="icon-[boxicons--user-circle] text-4xl"></span>
            <span class="mt-1.5">Your Profile</span>
          </a>
          <a
            class="selected"
            href="#"
            data-pagename="home-wall"
            data-action="navigate"
          >
            <span class="icon-[akar-icons--home] text-4xl"></span>
            <span class="mt-2">Home Wall</span>
          </a>
          <!-- <a href="#" data-pagename="search" data-action="navigate">
            <span class="icon-[ant-design--search-outlined] text-4xl"></span>
            <span class="mt-1">Search</span>
          </a> -->
        </nav>
      </section>
      <!-- CONTENT AREA -->
      <section
        class="scrollbar-custom h-[calc(100dvh - 3rem)] mt-8 overflow-y-auto"
      >
        <div
          class="page hidden"
          data-pagename="user-profile"
          data-wallid="profile-wall"
        >
          <!-- profile card -->
          <div
            id="profile-card"
            class="mx-auto mb-2 rounded-2xl border-2 border-solid border-primary bg-white px-[1.25rem_2rem] py-4"
          >
            <div class="flex items-start gap-4">
              <div
                class="bg-light/10 flex aspect-square h-24 w-24 shrink-0 items-center justify-center rounded-full"
              >
                <span class="icon-[boxicons--user-circle] text-8xl"></span>
              </div>
              <div class="flex min-h-24 flex-col justify-center gap-1">
                <h2
                  class="current-profile-name text-2xl font-bold"
                ></h2>
                <div class="flex items-center gap-1 text-sm text-gray-500">
                  <button class="simple-button" data-action="copyProfileID">
                    <span class="icon-[basil--copy-outline] text-2xl"></span>
                  </button>
                  <span id="display-profileid" class="mr-3"></span>
                </div>
              </div>
            </div>
            <textarea
              id="textarea-bio"
              class="textarea pointer-events-none mt-4 hidden w-full resize-none overflow-hidden leading-relaxed outline-0"
              rows="1"
              maxlength="160"
            ></textarea>
            <div
              class="mt-4 flex items-center justify-between border-t-2 border-muted pt-4 text-gray-500"
            >
              <div class="flex items-center gap-6">
                <div class="hover-dropdown">
                  <button class="simple-button">
                    <span
                      class="icon-[flowbite--user-edit-outline] text-2xl"
                    ></span>
                  </button>
                  <div class="hover-dropdown-content">
                    <div class="hover-dropdown-item" data-action="editBio">
                      <span
                        class="icon-[lets-icons--edit-alt] text-gray-500"
                      ></span>
                      <span>Edit Bio</span>
                    </div>
                  </div>
                </div>
                <div class="hover-dropdown">
                  <button class="simple-button">
                    <span
                      class="icon-[mdi--account-group-outline] text-2xl"
                    ></span>
                  </button>
                  <div
                    id="hover-dropdown-content-profile-change"
                    class="hover-dropdown-content"
                  >
                    <!-- from js -->
                  </div>
                </div>
                <div class="hover-dropdown">
                  <button class="simple-button">
                    <span class="icon-[akar-icons--gear] text-2xl"></span>
                  </button>
                  <div class="hover-dropdown-content">
                    <div
                      class="hover-dropdown-item"
                      data-action="openAccountSettingsModal"
                    >
                      <span
                        class="icon-[hugeicons--user-settings-02] text-gray-500"
                      ></span>
                      <span>Account Settings</span>
                    </div>
                    <div
                      class="hover-dropdown-item"
                      data-action="openProfileSettingsModal"
                    >
                      <span
                        class="icon-[hugeicons--user-settings-02] text-gray-500"
                      ></span>
                      <span>Profile Settings</span>
                    </div>
                  </div>
                </div>
              </div>
              <span>0 posts</span>
            </div>
          </div>
          <!-- post-creator -->
          <div
            class="post-creator flex flex-row items-center gap-2 rounded-2xl border-2 border-solid border-primary bg-white px-[1.25rem_2rem] py-4"
          >
            <span
              class="mt-1.5 icon-[hugeicons--quill-write-02] text-4xl"
            ></span>
            <span
              class="w-full rounded-4xl bg-muted p-[0.75rem_1rem] transition-all duration-300 select-none hover:bg-muted-hovered"
              data-action="openPostCreatorModal"
              >Create post</span
            >
          </div>
          <!-- wall -->
          <div id="profile-wall" data-profileid="user">
            <!-- posts provided by js -->
          </div>
        </div>
        <div class="page" data-pagename="home-wall" data-wallid="home-wall">
          <!-- post creator -->
          <div
            class="post-creator align-center flex flex-row gap-2 rounded-2xl border-2 border-solid border-primary bg-white px-[1.25rem_2rem] py-4"
          >
            <span
              class="mt-1.5 icon-[hugeicons--quill-write-02] text-4xl"
            ></span>
            <span
              class="w-full rounded-4xl bg-muted p-[0.75rem_1rem] transition-all duration-300 select-none hover:bg-muted-hovered"
              data-action="openPostCreatorModal"
              >Create post</span
            >
          </div>
          <!-- wall -->
          <div id="home-wall" data-profileid="null">
            <!-- posts provided by js -->
          </div>
        </div>
        <div class="page hidden" data-pagename="search">search</div>
      </section>
      <!-- RIGHT SIDE BAR -->
      <section>
        <!-- just to balance things out. no purpose of its own yet -->
      </section>
    </main>

    <!-- post creator modal -->
    <div id="post-creator-modal" class="scrollbar-custom modal-screen">
      <div class="modal-blur-overlay" data-action="closePostCreatorModal"></div>
      <div class="modal-card">
        <div class="border-b-2 border-muted">
          <p class="text-[150%] font-bold">Create post</p>
        </div>
        <div class="mt-4 flex flex-row gap-2">
          <span class="icon-[boxicons--user] text-2xl"></span>
          <span class="current-profile-name font-bold"></span>
        </div>
        <div class="mt-2">
          <textarea
            id="post-creator-modal-textarea-subject"
            class="textarea min-h-5 w-full resize-none overflow-hidden text-[150%] font-bold outline-0"
            placeholder="Enter subject"
            rows="1"
            maxlength="150"
          ></textarea>
          <textarea
            id="post-creator-modal-textarea-content"
            class="textarea w-full resize-none overflow-hidden outline-0"
            placeholder="Enter content"
            rows="3"
            maxlength="2000"
          ></textarea>
        </div>
        <div class="sticky bottom-0 border-t-2 border-muted bg-white pb-4">
          <button
            id="post-button"
            class="mt-4 w-full rounded-4xl bg-accent p-1 font-bold transition-all duration-300 enabled:hover:bg-accent-hovered enabled:hover:text-muted enabled:active:scale-95 disabled:cursor-not-allowed disabled:bg-muted"
            disabled
            data-action="createPost"
          >
            Post
          </button>
        </div>
      </div>
    </div>

    <!-- post modal -->
    <div id="post-modal" class="scrollbar-custom modal-screen">
      <div class="modal-blur-overlay" data-action="closePostModal"></div>
      <div class="modal-card">
        <div id="post-modal-content">
          <!-- post modal content goes here -->
        </div>
      </div>
    </div>

    <!-- settings modal -->
    <div id="settings-modal" class="scrollbar-custom modal-screen">
      <div class="modal-blur-overlay" data-action="closeSettingsModal"></div>
      <div class="modal-card">
        <div id="settings-modal-content">
          <!-- whatever goes here -->
        </div>
      </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script type="module" src="static/script.js"></script>
  </body>
</html>
