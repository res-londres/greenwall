<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='dist/output.css') }}"
    />
    <title>Greenwall</title>
  </head>
  <body class="text-primary">
    <main
      class="grid h-dvh grid-cols-[20%_1fr_20%] grid-rows-[3rem_1fr] overflow-hidden bg-surface"
    >
      <!-- HEADER -->
      <section
        class="sticky top-0 col-span-full h-12 border-b-2 border-solid border-b-primary bg-accent"
      >
        <h1 class="ml-6 font-heading text-white">greenwall</h1>
      </section>
      <!-- LEFT SIDE BAR / NAVIGATION -->
      <section
        class="h-[calc(100dvh - 3rem)] sticky top-12 overflow-x-hidden overflow-y-auto"
      >
        <nav id="page-navigator" class="mt-8 flex flex-col select-none">
          <a href="#" data-pagename="user-profile" data-action="navigate">
            <span class="text-4xl icon-[boxicons--user-circle]"></span>
            <span class="mt-1.5">Your Profile</span>
          </a>
          <a
            class="selected"
            href="#"
            data-pagename="home-wall"
            data-action="navigate"
          >
            <span class="text-4xl icon-[akar-icons--home]"></span>
            <span class="mt-2">Home Wall</span>
          </a>
          <a href="#" data-pagename="search" data-action="navigate">
            <span class="text-4xl icon-[ant-design--search-outlined]"></span>
            <span class="mt-1">Search</span>
          </a>
        </nav>
      </section>
      <!-- CONTENT AREA -->
      <section
        class="scrollbar-custom h-[calc(100dvh - 3rem)] mt-8 overflow-y-auto"
      >
        <div class="page hidden" data-pagename="user-profile" data-wallid="profile-wall">
          <!-- profile card -->
          <div class="border-2 border-solid border-primary bg-white px-[1.25rem_2rem] py-4 rounded-2xl mx-auto mb-4">
            <div class="flex items-start gap-4">
              <div class="w-24 h-24 aspect-square rounded-full bg-light/10 flex items-center justify-center shrink-0">
                <span class="text-8xl icon-[boxicons--user-circle]"></span>
              </div>
              <div class="flex flex-col justify-center min-h-24 gap-1">
                <h2 class="text-2xl font-bold">Display Name</h2>
                <div class="flex items-center gap-3 text-sm text-gray-500">
                  <span class="mr-3">account_id1</span>
                  <button 
                    class="hover:text-accent hover:scale-110 active:scale-100 transition-all duration-300"
                  >
                    <span class="text-2xl icon-[akar-icons--eye-open]"></span>
                  </button>
                  <button 
                    class="hover:text-accent hover:scale-110 active:scale-100 transition-all duration-300"
                  >
                    <span class="text-2xl icon-[basil--copy-outline]"></span>
                  </button>
                </div>
              </div>
            </div>
            <p class="mt-4 leading-relaxed">
              bio
            </p>
            <div class="border-t-2 border-muted mt-4 pt-4 flex items-center justify-between text-gray-500">
              <div class="flex items-center gap-6">
                <button class="hover:text-accent hover:scale-110 active:scale-100 transition-all duration-300">
                  <span class="text-2xl icon-[flowbite--user-edit-outline]"></span>
                </button>
                <button class="hover:text-accent hover:scale-110 active:scale-100 transition-all duration-300">
                  <span class="text-2xl icon-[mdi--account-group-outline]"></span>
                </button>
                <button class="hover:text-accent hover:scale-110 active:scale-100 transition-all duration-300">
                  <span class="text-2xl icon-[akar-icons--gear]"></span>
                </button>
              </div>
              <span>0 posts</span>
            </div>
          </div>
          <!-- post-creator -->
          <div
            class="post-creator items-center flex flex-row gap-2 rounded-2xl border-2 border-solid border-primary bg-white px-[1.25rem_2rem] py-4"
          >
            <span class="text-4xl mt-1.5 icon-[hugeicons--quill-write-02]"></span>
            <span
              class="w-full rounded-4xl bg-muted p-[0.75rem_1rem] transition-all duration-300 select-none hover:bg-muted-hovered"
              data-action="openPostCreatorModal"
              >Create post</span
            >
          </div>
          <!-- wall -->
          <div id="profile-wall">
            <!-- posts provided by js -->
          </div>
        </div>
        <div class="page" data-pagename="home-wall" data-wallid="home-wall">
          <!-- post creator -->
          <div
            class="post-creator align-center flex flex-row gap-2 rounded-2xl border-2 border-solid border-primary bg-white px-[1.25rem_2rem] py-4"
          >
            <span class="text-4xl mt-1.5 icon-[hugeicons--quill-write-02]"></span>
            <span
              class="w-full rounded-4xl bg-muted p-[0.75rem_1rem] transition-all duration-300 select-none hover:bg-muted-hovered"
              data-action="openPostCreatorModal"
              >Create post</span
            >
          </div>
          <!-- wall -->
          <div id="home-wall">
            <!-- posts provided by js -->
          </div>
        </div>
        <div class="page hidden" data-pagename="search">search</div>
      </section>
      <!-- RIGHT SIDE BAR -->
      <section>
        <!-- just to balance things out. no purpose of its own yet -->
      </section>
    </main>

    <!-- post creator modal -->
    <div
      id="post-creator-modal"
      class="scrollbar-custom modal-screen"
    >
      <div
        class="modal-blur-overlay"
        data-action="closePostCreatorModal"
      ></div>
      <div
        class="modal-card"
      >
				<div class="border-b-2 border-muted">
					<p class="text-[150%] font-bold">Create post</p>
				</div>
				<div class="mt-4 flex flex-row gap-2">
					<span class="text-2xl icon-[boxicons--user]"></span>
					<span class="font-bold">account-name</span>
				</div>
				<div class="mt-2">
					<textarea
            id="post-creator-modal-textarea-subject"
						class="textarea min-h-5 w-full resize-none overflow-hidden text-[150%] font-bold outline-0"
						placeholder="Enter subject"
						rows="1"
						maxlength="150"
					></textarea>
					<textarea
            id="post-creator-modal-textarea-content"
						class="textarea w-full resize-none overflow-hidden outline-0"
						placeholder="Enter content"
						rows="3"
						maxlength="2000"
					></textarea>
				</div>
				<div class="sticky bottom-0 border-t-2 border-muted bg-white pb-4">
					<button
            id="post-button"
						class="mt-4 w-full rounded-4xl bg-accent p-1 font-bold transition-all duration-300 enabled:hover:bg-accent-hovered enabled:hover:text-muted enabled:active:scale-95 disabled:cursor-not-allowed disabled:bg-muted"
            disabled
            data-action="createPost"
					>
						Post
					</button>
				</div>
      </div>
    </div>

    <!-- post modal -->
    <div id="post-modal" class="scrollbar-custom modal-screen">
      <div class="modal-blur-overlay" data-action="closePostModal"></div>
      <div class="modal-card">
        <div id="post-modal-content">
          <!-- post modal content goes here -->
        </div>
      </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script type="module" src="static/script.js"></script>
  </body>
</html>
