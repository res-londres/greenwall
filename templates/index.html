<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='dist/output.css') }}"
    />
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <title>Greenwall</title>
  </head>
  <body class="text-primary">
    <main
      class="grid h-dvh grid-cols-[20%_1fr_20%] grid-rows-[3rem_1fr] overflow-hidden bg-surface"
    >
      <!-- HEADER -->
      <section
        class="sticky top-0 col-span-full h-12 border-b-2 border-solid border-b-primary bg-accent"
      >
        <h1 class="ml-6 font-heading text-white">greenwall</h1>
      </section>
      <!-- LEFT SIDE BAR / NAVIGATION -->
      <section
        class="h-[calc(100dvh - 3rem)] sticky top-12 overflow-x-hidden overflow-y-auto"
      >
        <nav id="page-navigator" class="mt-8 flex flex-col select-none">
          <a href="#" data-pagename="user-profile" data-action="navigate">
            <i class="hgi hgi-stroke hgi-rounded hgi-user-circle text-3xl"></i>
            <span>Profile</span>
          </a>
          <a
            class="selected"
            href="#"
            data-pagename="home-wall"
            data-action="navigate"
          >
            <i class="hgi hgi-stroke hgi-rounded hgi-home-01 text-3xl"></i>
            <span>Home Wall</span>
          </a>
          <a href="#" data-pagename="search" data-action="navigate">
            <i class="hgi hgi-stroke hgi-rounded hgi-search-02 text-3xl"></i>
            <span>Search</span>
          </a>
        </nav>
      </section>
      <!-- CONTENT AREA -->
      <section
        class="scrollbar-custom h-[calc(100dvh - 3rem)] mt-8 overflow-y-auto"
      >
        <div class="page hidden" data-pagename="user-profile">user profile</div>
        <div class="page" data-pagename="home-wall">
          <!-- post creator -->
          <div
            class="post-creator align-center flex flex-row gap-2 rounded-2xl border-2 border-solid border-primary bg-white px-[1.25rem_2rem] py-4"
            data-creatorid="home-wall"
          >
            <i
              class="hgi hgi-stroke hgi-rounded hgi-quill-write-01 mt-2 text-3xl"
            ></i>
            <span
              class="w-full rounded-4xl bg-muted p-[0.75rem_1rem] transition-all duration-300 select-none hover:bg-muted-hovered"
              data-action="openPostCreatorModal"
              data-creatorid="home-wall"
              >Create post</span
            >
          </div>
        </div>
        <div class="page hidden" data-pagename="search">search</div>
      </section>
      <!-- RIGHT SIDE BAR -->
      <section>
        <!-- just to balance things out. no purpose of its own yet -->
      </section>
    </main>

    <!-- post creator modal -->
    <div
      id="post-creator-modal"
      class="scrollbar-custom fixed top-0 left-0 z-10 flex h-full w-full items-center justify-center p-6"
    >
      <div
        class="fixed top-0 left-0 h-full w-full backdrop-blur-xs"
        data-action="closePostCreatorModal"
      ></div>
      <div
        class="relative z-10 max-h-[85dvh] w-full max-w-175 overflow-y-auto rounded-2xl border-2 border-solid border-primary bg-white p-[1.5rem_2rem_0_2rem]"
      >
        <div>
          <div class="border-b-2 border-muted">
            <p class="text-[150%] font-bold">Create post</p>
          </div>
          <div class="mt-4 flex flex-col gap-2">
            <div class="flex gap-2">
              <i class="hgi hgi-stroke hgi-rounded hgi-user-02 text-2xl"></i>
              <span class="font-bold">account-name</span>
            </div>
            <div>
              <textarea
                class="textarea min-h-5 w-full resize-none overflow-hidden text-[150%] font-bold outline-0"
                placeholder="Enter subject"
                rows="1"
                maxlength="150"
              ></textarea>
              <textarea
                class="textarea w-full resize-none overflow-hidden outline-0"
                placeholder="Enter content"
                rows="3"
                maxlength="2000"
              ></textarea>
            </div>
            <div class="sticky bottom-0 border-t-2 border-muted bg-white pb-4">
              <button
                class="mt-4 w-full rounded-4xl bg-accent p-1 font-bold transition-all duration-300 hover:bg-accent-hovered hover:text-muted active:scale-95"
              >
                Post
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="static/script.js"></script>
  </body>
</html>
