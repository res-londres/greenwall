<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='dist/output.css') }}"
    />
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <title>Greenwall</title>
  </head>
  <body>
    <main
      class="grid h-dvh grid-cols-[20%_1fr_20%] grid-rows-[3rem_1fr] overflow-hidden bg-surface"
    >
      <section
        class="sticky top-0 col-span-full h-12 border-b-2 border-solid border-b-primary bg-accent"
      >
        <h1 class="ml-6 font-heading text-white">greenwall</h1>
      </section>
      <section
        class="h-[calc(100dvh - 3rem)] sticky top-12 overflow-x-hidden overflow-y-auto"
      >
        <nav class="mt-8 flex flex-col select-none">
          <a href="#" data-pagename="user-profile" data-action="navigate">
            <i class="hgi hgi-stroke hgi-rounded hgi-user-circle text-3xl"></i>
            <span>Profile</span>
          </a>
          <a
            class="selected"
            href="#"
            data-pagename="home-wall"
            data-action="navigate"
          >
            <i class="hgi hgi-stroke hgi-rounded hgi-home-01 text-3xl"></i>
            <span>Home Wall</span>
          </a>
          <a href="#" data-pagename="search" data-action="navigate">
            <i class="hgi hgi-stroke hgi-rounded hgi-search-02 text-3xl"></i>
            <span>Search</span>
          </a>
        </nav>
      </section>
      <section
        class="scrollbar-custom h-[calc(100dvh - 3rem)] mt-8 overflow-y-auto"
      >
        <div class="page hidden" data-pagename="user-profile">user profile</div>
        <div class="page" data-pagename="home-wall">
          <!-- post creator -->
          <div
            class="align-center flex flex-row gap-2 rounded-2xl border-2 border-solid border-primary bg-white px-[1.25rem_2rem] py-4"
            data-creatorid="home-wall"
          >
            <i
              class="hgi hgi-stroke hgi-rounded hgi-quill-write-01 mt-2 text-3xl"
            ></i>
            <span
              class="w-full rounded-4xl bg-muted p-[0.75rem_1rem] transition-all duration-300 select-none hover:bg-muted-hovered"
              >Create post</span
            >
          </div>
        </div>
        <div class="page hidden" data-pagename="search">search</div>
      </section>
      <section>
        <!-- just to balance things out. no purpose of its own yet -->
      </section>
    </main>

    <script type="module" src="static/script.js"></script>
  </body>
</html>
