<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='dist/output.css') }}"
    />
    <title>Greenwall</title>
  </head>
  <body class="text-primary">
    <div id="loading-screen-mount"></div>
    <div id="auth-screen-mount"></div>
    <div id="main-screen-mount"></div>
    <div id="post-creator-modal-mount"></div>
    <div id="post-modal-mount"></div>
    <div id="settings-modal-mount"></div>

    <div id="templates" hidden>
      <template id="tpl-post-card">
        <div
          id=""
          class="bg-white text-primary border-2 border-solid border-primary rounded-2xl my-2 px-6 py-[1rem_0.5rem]"
          data-slot="post-id"
          data-action="openPostModal"
          data-postid=""
        >
          <div class="items-center flex justify-between mb-2">
            <span class="text-[0.95rem] font-bold" data-slot="attribution"></span>
            <span class="text-gray-500 text-[0.75rem]" data-slot="time"></span>
          </div>
          <div class="font-bold leading-6 mb-3 wrap-break-word" data-slot="subject"></div>
          <div class="text-[0.95rem] leading-6 mb-3 wrap-break-word" data-slot="content-preview"></div>
          <div class="items-center border-t border-solid border-muted flex gap-6 pt-2">
            <button class="post-action" data-action="likePost" data-postid="">
              <span data-slot="like-icon"></span>
              <span data-slot="like-count"></span>
            </button>
            <button class="post-action" data-action="openPostModal" data-postid="">
              <span>
                <span class="text-2xl icon-[ant-design--comment-outlined]"></span>
              </span>
              <span data-slot="comment-count"></span>
            </button>
          </div>
        </div>
      </template>
      <template id="tpl-comment">
        <div
          class="text-primary border-t border-solid border-muted flex flex-row gap-2 py-2 items-start"
          data-slot="post-id"
          data-slot="comment-id"
          data-postid=""
          data-commentid=""
        >
          <div class="flex flex-1 flex-col min-w-0">
            <div class="flex gap-2 items-center">
              <span class="font-bold whitespace-nowrap" data-slot="attribution"></span>
              <span class="text-gray-500 text-[0.9rem]" data-slot="time"></span>
            </div>
            <div class="wrap-anywhere" data-slot="content"></div>
          </div>
          <button
            class="mt-2 shrink-0 self-start flex flex-col items-center gap-0.5 bg-none border-none rounded-sm text-gray-500 cursor-pointer text-[0.85rem] transition-all duration-300 origin-top hover:text-accent hover:scale-110 active:scale-100"
            data-action="likeComment"
            data-postid=""
            data-commentid=""
          >
            <span data-slot="like-icon"></span>
            <span data-slot="like-count"></span>
          </button>
        </div>
      </template>
    </div>

    <script type="module" src="static/script.js"></script>
  </body>
</html>
